services:
  # Backend API Web Service
  - type: web
    name: kjbn-produce-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./procurement.db
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: static
    name: kjbn-produce-frontend
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: kjbn-produce-backend
          property: host
